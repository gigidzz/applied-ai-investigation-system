[project]
name = "ragsys"
version = "0.1.0"
description = "Agentic RAG system for multi-document retrieval, cross-referencing and evidence-grounded question answering"
readme = "README.md"
authors = [
    { name = "dzimistarishviligigi", email = "dzimistarishviligigi@gmail.com" }
]
# Free hosting platforms run 3.12, and matching local to deployed avoids
# debugging version differences at release time.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    # The embedding model runs under ONNX Runtime rather than PyTorch. Same
    # weights and the same vectors to 0.999999 cosine similarity, measured;
    # 345 MB resident instead of 626 MB, which is the difference between
    # fitting a 512 MB free tier and not. See docs/ROADMAP.md.
    "fastembed>=0.9.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    # Not optional on macOS: the python.org build ships no certificate
    # bundle, so every HTTPS call fails without it. It was previously
    # present only as a transitive dependency of a package since removed.
    "truststore>=0.10.5",
    "uvicorn[standard]>=0.54.0",
]

# Local development installs the corpus-building group too; deployment
# does not need it (dataset download and document generation are offline
# build steps, not runtime concerns).
[tool.uv]
default-groups = ["dev", "corpus"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax,
# B: likely bugs, SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
compare = [
    # Only to reproduce the PyTorch/ONNX vector comparison.
    "sentence-transformers>=6.2.0",
]
corpus = [
    "datasets>=5.1.0",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
